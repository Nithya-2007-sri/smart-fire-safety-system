log('Worker on ESD conductive mat → measuring body static voltage');hud('Static voltage: <b style="color:#ffb020">3.4 kV (HIGH)</b>');await sl(1500);
if($('ung').checked){log('GROUNDING VERIFICATION FAILED (open ground path). Entry door stays LOCKED','e');esdLed.material.color.set(0xff2020);hud('<b style="color:#ff6b6b">ACCESS DENIED</b> – wear ESD footwear / connect wrist strap');beep(300,.3);setTimeout(()=>beep(300,.3),450);await sl(3500);hud('');esdLed.material.color.set(0xffa000);log('Untick "not grounded" and press the button again','w');busy=false;btn();return}
log('Grounding path verified (0.8 MΩ) → discharging static via mat');for(let v=3.4;v>=0;v-=.34){hud('Discharging… <b style="color:#ffb020">'+Math.max(0,v).toFixed(1)+' kV</b>');for(let j=0;j<3;j++)sp(-11.8+rn()*.5,1.1+rn()*.3,rn()*.3,rn()*1.5,rn()*1.5,rn()*1.5,.35,.3,.05,0x66ccff,1);await sl(140)}
esdLed.material.color.set(0x22ff66);lockLed.material.color.set(0x22ff66);beep(1000,.25);hud('<b style="color:#5cf29a">0.0 kV – SAFE ENTRY</b>');log('Static = 0.0 kV → SAFE ENTRY, entry door UNLOCKED','ok');step(1,true);dIn.t=1;await sl(1200);hud('');
await walk(-8.5,0,2);dIn.t=0;lockLed.material.color.set(0xff2020);esdLed.material.color.set(0xffa000);log('Worker inside → entry door closed & re-locked');await walk(-3.5,1.8,2);inside=true;entered=true;busy=false;btn();log('Worker at workstation. Now click on the floor (or press Trigger fire).','ok')}
async function fireSeq(x,z){if(busy||done)return;busy=true;done=true;btn();audio();
F={x,z,i:0,on:true,sup:false,l:new T.PointLight(0xff6a1a,0,14)};F.l.position.set(x,1,z);S.add(F.l);const ch=new T.Mesh(new T.CircleGeometry(1,24),new T.MeshBasicMaterial({color:0x050505,transparent:true,opacity:.7}));ch.rotation.x=-1.5708;ch.position.set(x,.03,z);S.add(ch);F.ch=ch;
log('!! Spark / ignition at ('+x.toFixed(1)+', '+z.toFixed(1)+')','e');step(2);
await until(()=>cnt()>=1);log('ESP32: '+cnt()+'/4 sensors active → VERIFYING (no action yet – false-alarm filter)','w');step(3);
await until(()=>cnt()>=3);log('ESP32 SENSOR FUSION: '+cnt()+'/4 sensors agree → FIRE EVENT CONFIRMED','e');
step(4);power(false);log('RELAY → OPEN: non-essential electrical loads isolated (POWER CUT)','w');alarm=true;units.forEach(u=>u.l.material.color.set(0xff2020));siren(true);log('ALARM ON: siren + buzzer + LEDs','e');bn('FIRE DETECTED – POWER ISOLATED','r');
await sl(1500);step(5);evac=true;dOut.t=1;exM.emissiveIntensity=1.6;log('Emergency exit door RELEASED, green LED evacuation path ON','ok');say();vT=setInterval(say,4500);bn('வெளியேறுங்கள்! (Veliyerunga!)','r');log('Tamil voice alert: "Veliyerunga! Veliyerunga!"','w');
if(inside){await walk(16,0,4.6);inside=false;log('Head-count: 1/1 worker evacuated to assembly point','ok')}else log('No personnel inside zone');
await sl(800);clearInterval(vT);speechSynthesis.cancel();evac=false;exM.emissiveIntensity=.6;
step(6);bn('ZONE ISOLATION → N2 SUPPRESSION','o');log('Solenoid/dampers: zone shut-off CLOSED (fire sealed in)','w');dmp.userData.t=1;vM.material.color.set(0x22aa55);vLed.material.color.set(0xff2020);await sl(1800);
noz=units.map(u=>({u,d:Math.hypot(u.nz.x-x,u.nz.z-z)})).sort((a,b)=>a.d-b.d).slice(0,2).map(o=>o.u.nz);log('Localized N2 discharge from nearest 2 nozzles (targeted area)','ok');discharge=true;F.sup=true;
await until(()=>!F.on);await sl(2500);discharge=false;siren(false);alarm=false;emL.intensity=.25;bcM.color.set(0xb9770e);units.forEach(u=>u.l.material.color.set(0xb9770e));
log('FIRE SUPPRESSED. Zone stays isolated & de-energised until manual clearance. Press Reset to run again.','ok');step(6,true);bn('FIRE SUPPRESSED – ZONE SAFE','g');busy=false;btn()}
function fireAt(x,z){if(busy){log('Sequence running – wait or press Reset','w');return}if(done){log('Press Reset to run the demo again','w');return}fireSeq(x,z)}
function pick(e){const m=new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),ray=new T.Raycaster(),p=new T.Vector3();ray.setFromCamera(m,cam);if(ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),p)&&Math.abs(p.x)<9.4&&Math.abs(p.z)<6.4)fireAt(p.x,p.z)}
$('b1').onclick=entry;$('b2').onclick=()=>fireAt(-5+Math.random()*10,(Math.random()<.5?-1:1)*(2+Math.random()*3));$('b3').onclick=()=>location.reload();
dmp.userData.t=0;step(0);log('System armed. ESP32 monitoring 4 sensors. Press "Worker enters".','ok');btn();
/* loop */
let last=performance.now();
function tick(){requestAnimationFrame(tick);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
[dIn,dOut].forEach(d=>{d.c+=(d.t-d.c)*Math.min(1,dt*3);d.p.rotation.y=d.c*1.45});
dmp.scale.y+=((dmp.userData.t?1:.12)-dmp.scale.y)*Math.min(1,dt*2);
if(W.tx!==null){const dx=W.tx-W.g.position.x,dz=W.tz-W.g.position.z,d=Math.hypot(dx,dz);if(d<.1){W.tx=null;[W.lL,W.lR,W.aL,W.aR].forEach(l=>l.rotation.x=0);const r=W.res;W.res=null;r&&r()}else{const s=Math.min(d,W.sp*dt);W.g.position.x+=dx/d*s;W.g.position.z+=dz/d*s;W.g.rotation.y=Math.atan2(dx,dz);W.ph+=dt*W.sp*3.5;const a=Math.sin(W.ph)*.6;W.lL.rotation.x=a;W.lR.rotation.x=-a;W.aL.rotation.x=-a;W.aR.rotation.x=a}}
if(pw){pad.rotation.y+=dt*4;crs.forEach(c=>{c.position.x+=dt*.9;if(c.position.x>4)c.position.x=-1.5})}
ledC.material.color.set((time*3|0)%2?0x3aa0ff:0x0a2a55);
if(alarm){emL.intensity=Math.sin(time*9)>0?1.6:.2;bcM.color.set(Math.sin(time*9)>0?0xff2020:0x550000);units.forEach(u=>u.l.material.color.set(Math.sin(time*9)>0?0xff2020:0x550000))}
chev.forEach((c,i)=>{c.material.emissiveIntensity=evac?((((time*7|0)-i)%4+4)%4==0?2:.1):0});
if(F){if(F.on){if(F.sup)F.i-=dt/6;else F.i=Math.min(1,F.i+dt*.5);if(F.sup&&F.i<=.03){F.on=false;F.i=0;F.l.intensity=0}
if(F.on){const i=F.i,n=Math.floor(i*3+Math.random()),sc=.4+i;for(let k=0;k<n;k++){sp(F.x+rn()*.5*sc,.15,F.z+rn()*.5*sc,rn()*.3,1.8+Math.random()*1.5,rn()*.3,.9,.5+i,.15,0xff5a14,1,0,.9);sp(F.x+rn()*.3*sc,.2,F.z+rn()*.3*sc,0,1.5+Math.random(),0,.6,.4+i*.4,.1,0xffd060,1,0,.9)}
if(Math.random()<i*.5)sp(F.x+rn()*.4,1.2,F.z+rn()*.4,rn()*.3,1,rn()*.3,3.2,.8,3.8,0x555555,0,0,.4);if(Math.random()<.25*i)sp(F.x,.4,F.z,rn()*3,3+Math.random()*2,rn()*3,.7,.12,.05,0xffdd66,1,-7);
F.l.intensity=(1.4+Math.random()*.8)*i*2;F.ch.scale.setScalar(.4+i*.8)}}}
if(discharge){noz.forEach(n=>{for(let k=0;k<3;k++)sp(n.x+rn()*.15,n.y,n.z+rn()*.15,rn()*1.2,-3-Math.random(),rn()*1.2,1.6,.5,2.8,0xbfe6ff,0,0,.5)});if(F)sp(F.x+rn()*1.4,.3+Math.random()*.6,F.z+rn()*1.4,rn()*.4,.1,rn()*.4,2.2,1.2,3.2,0xcfeaff,0,0,.35)}
for(let i=P.length-1;i>=0;i--){const p=P[i];p.l-=dt;if(p.l<=0){S.remove(p.s);p.s.material.dispose();P.splice(i,1);continue}const t=1-p.l/p.m;p.vy+=p.g*dt;const q=p.s.position;q.x+=p.vx*dt;q.y=Math.max(.05,q.y+p.vy*dt);q.z+=p.vz*dt;const s=p.s0+(p.s1-p.s0)*t;p.s.scale.set(s,s,1);p.s.material.opacity=p.o*(1-t)*(t<.1?t*10:1)}
sense(dt);oc();R.render(S,cam)}
tick();
</script></body></html>
